[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-coach"
version = "0.1.0"
description = "Football AI Coach: match recording to a catalog of timed events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2",
    "structlog",
    "numpy",
    "opencv-python-headless",
    "streamlit>=1.40,<2",
    "yt-dlp>=2026.10.26",
    "pytesseract>=0.3.13",
    "google-genai>=3.3",
    "httpx2>=2",  # its exceptions are caught in aicoach.agent.llm (a dependency of google-genai)
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "pre-commit",
]

# T-DEED on a video card (the `tdeed` command, D-080). Only what `inference.py` imports besides
# torch, with lower bounds and no pins, so that it installs on Python 3.13 (Colab). torch and
# torchvision are NOT here: Colab has them, and a local GPU needs the build for its own CUDA from
# pytorch.org (README, section 5); timm pulls them in only when they are missing.
# Only in this extra, with the owner's agreement (D-080); the base install is unchanged.
gpu = [
    "timm>=1.0.3",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "wandb",
    "SoccerNet",
    "matplotlib",
    "tabulate",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aicoach.agent" = ["system_prompt.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# The Colab launcher of `tdeed` (D-080) is a notebook: it prints and uses `!` commands on purpose.
extend-exclude = ["notebooks/tdeed_colab.ipynb"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "C4",
    "PTH", "T20", "S", "ARG", "RET", "TRY", "PERF",
]

[tool.ruff.lint.per-file-ignores]
# pytest tests rely on plain assert
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# yt-dlp ships no type information; it is called in one module (aicoach.ingest.download).
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytesseract ships no type information; it is called in one module (aicoach.plate_names.reader).
module = ["pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-socket",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "unit: fast isolated tests",
    "integration: several modules together, no network (ffmpeg allowed)",
    "data_validation: data contracts, schemas, configs",
    "real_data: needs local match data, skipped by default",
    "slow: long-running tests",
    "live_llm: calls the real Gemini API (key and network needed), skipped by default",
]

[tool.coverage.run]
source = ["src/aicoach"]
branch = true
omit = ["src/aicoach/ui/app.py", "src/aicoach/cli.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
