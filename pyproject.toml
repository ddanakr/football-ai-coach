[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-coach"
version = "0.1.0"
description = "Football AI Coach: match recording to a catalog of timed events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv>=1.2",
    "structlog",
    "numpy",
    "opencv-python-headless",
    "streamlit>=1.40,<2",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "C4",
    "PTH", "T20", "S", "ARG", "RET", "TRY", "PERF",
]

[tool.ruff.lint.per-file-ignores]
# pytest tests rely on plain assert
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# yt-dlp ships no type information; it is called in one module (aicoach.ingest.download).
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-socket",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "unit: fast isolated tests",
    "integration: several modules together, no network (ffmpeg allowed)",
    "data_validation: data contracts, schemas, configs",
    "real_data: needs local match data, skipped by default",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/aicoach"]
branch = true
omit = ["src/aicoach/ui/app.py", "src/aicoach/cli.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
