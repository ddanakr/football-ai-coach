default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Version checked against the GitHub tags and PyPI on 2026-11-14 (D-057).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, perf, test, docs, chore, build, ci]

  - repo: local
    hooks:
      # Runs the project venv interpreter by relative path, so no venv activation
      # is needed on Windows and mypy sees the project dependencies.
      - id: mypy
        name: mypy
        entry: '".venv\Scripts\python.exe" -m mypy'
        language: system
        types: [python]
        pass_filenames: false
      - id: forbid-ai-attribution
        name: forbid AI attribution in commit messages
        description: GIT.md section 7. Rejects Co-Authored-By, "Generated with" and the Anthropic noreply address.
        entry: (?i)co-authored-by|generated with|noreply@anthropic\.com
        language: pygrep
        stages: [commit-msg]
      - id: commit-subject-length
        name: commit subject at most 72 bytes
        description: GIT.md section 2. Matches a first line of 73 or more bytes (subjects are ASCII, CRLF is not counted) (multiline mode makes \A the start of the message file).
        entry: '\A[^\r\n]{73}'
        language: pygrep
        args: [--multiline]
        stages: [commit-msg]
      - id: forbid-notebooks
        name: forbid Jupyter notebooks
        entry: Jupyter notebooks are forbidden (CLAUDE.md section 7); use scratch/*.py
        language: fail
        files: \.ipynb$
        exclude: ^notebooks/tdeed_colab\.ipynb$  # the Colab launcher of `tdeed` (D-080)
